<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SBI Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0d47a1, #1976d2, #42a5f5); display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .marquee { position: absolute; top: 0; width: 100%; background: #0d47a1; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; }
    .marquee span { display: inline-block; padding-left: 100%; animation: moveText 12s linear infinite; font-weight: 600; letter-spacing: 2px; }
    @keyframes moveText { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    .login-card { width: 380px; border-radius: 15px; background: #ffffff; box-shadow: 0 15px 40px rgba(0,0,0,0.25); padding: 30px; margin-top: 50px; }
    .bank-title { color: #0d47a1; font-weight: bold; }
    .btn-login { background: #0d47a1; color: white; transition: 0.3s; }
    .btn-login:hover { background: #1565c0; transform: scale(1.03); }
    .new-user { font-size: 14px; }
    .new-user a { text-decoration: none; color: #0d47a1; font-weight: 500; }
    .new-user a:hover { text-decoration: underline; }
    .form-control:focus { border-color: #0d47a1; box-shadow: 0 0 5px rgba(13, 71, 161, 0.5); }
  </style>
</head>
<body>
  <div class="marquee">
    <span>STATE BANK OF INDIA • STATE BANK OF INDIA • STATE BANK OF INDIA •</span>
  </div>
  <div class="login-card text-center">
    <h4 class="bank-title mb-3">State Bank of India</h4>
    <form action="loginServlet" method="post">
      <div class="mb-3 text-start">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" placeholder="Enter username" required name="uname">
        </div>
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" placeholder="Enter password" required name="upassword">
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
    <div class="mt-3 new-user">
      <span>New user? ❓</span>
      <a href="userRegistration.html">Register here</a>
    </div>
  </div>
</body>
</html>
